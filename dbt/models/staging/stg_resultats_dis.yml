version: 2

models:
  - name: stg_resultats_dis
    description: >
      Modèle de staging des résultats du contrôle sanitaire de l'eau potable
      issus de l'API Hub'Eau. Le modèle conserve le grain et les 32 champs
      de la source RAW. Les transformations métier, notamment l'interprétation
      des résultats censurés, le parsing des limites et références de qualité
      et l'éclatement des réseaux, sont volontairement reportées à la couche ODS.

    columns:

      # -----------------------------------------------------------------------
      # Géographie
      # -----------------------------------------------------------------------

      - name: code_departement
        description: >
          Code du département associé au prélèvement. Conservé en STRING
          car il s'agit d'un identifiant géographique et non d'une mesure.

      - name: nom_departement
        description: "Nom du département associé au prélèvement."

      - name: code_commune
        description: >
          Code de la commune associée au prélèvement. Candidat à
          l'identification métier de la commune dans le futur modèle
          décisionnel.

      - name: nom_commune
        description: "Nom de la commune associée au prélèvement."

      # -----------------------------------------------------------------------
      # Prélèvement / analyse
      # -----------------------------------------------------------------------

      - name: code_prelevement
        description: >
          Identifiant du prélèvement fourni par Hub'Eau. Plusieurs résultats
          de paramètres peuvent être associés à un même prélèvement ; aucune
          contrainte d'unicité n'est donc définie dans la couche staging.
        data_tests:
          - not_null

      - name: reference_analyse
        description: >
          Référence de l'analyse associée au résultat lorsqu'elle est fournie
          par la source. Elle peut être absente pour certains résultats et ne
          constitue pas un identifiant unique du résultat : une même référence
          peut être partagée par plusieurs paramètres.

      - name: date_prelevement
        description: >
          Date et heure du prélèvement. Le TIMESTAMP source est conservé
          sans création d'attributs calendaires dans la couche staging.
        data_tests:
          - not_null

      - name: code_lieu_analyse
        description: >
          Code du lieu d'analyse fourni par la source. Ce champ participe
          à la distinction de plusieurs résultats d'un même paramètre pour
          un même prélèvement.
          
      # -----------------------------------------------------------------------
      # Paramètre
      # -----------------------------------------------------------------------

      - name: code_parametre
        description: >
          Code du paramètre analysé. Le périmètre analytique actuel couvre
          12 paramètres de qualité de l'eau sélectionnés pour le projet.
        data_tests:
          - not_null

      - name: code_parametre_se
        description: "Code SE associé au paramètre."

      - name: code_parametre_cas
        description: >
          Code CAS associé au paramètre lorsqu'il est fourni par la source.
          Les valeurs absentes sont volontairement conservées à NULL.

      - name: libelle_parametre
        description: "Libellé du paramètre analysé."

      - name: libelle_parametre_maj
        description: "Libellé du paramètre dans sa représentation en majuscules."

      - name: libelle_parametre_web
        description: >
          Libellé web du paramètre lorsqu'il est fourni par la source.
          Les valeurs absentes sont volontairement conservées à NULL.

      - name: code_type_parametre
        description: "Code du type de paramètre fourni par Hub'Eau."

      # -----------------------------------------------------------------------
      # Résultat / unité
      # -----------------------------------------------------------------------

      - name: resultat_alphanumerique
        description: >
          Représentation alphanumérique du résultat. Ce champ est conservé
          car il porte une information qui peut être perdue dans la valeur
          numérique, notamment pour les résultats censurés tels que '<0,5'
          ou pour certaines valeurs non mesurées telles que 'N.M.'.
        data_tests:
          - not_null

      - name: resultat_numerique
        description: >
          Représentation numérique du résultat fournie par la source. Elle peut
          être NULL lorsque le résultat est uniquement alphanumérique, notamment
          pour les valeurs 'N.M.'. Une valeur numérique égale à 0 ne doit pas
          non plus être interprétée automatiquement comme une mesure réellement
          nulle lorsque le résultat alphanumérique indique une valeur censurée.

      - name: code_unite
        description: "Code de l'unité associée au résultat."

      - name: libelle_unite
        description: >
          Libellé de l'unité associée au résultat. L'unité dépend du paramètre
          analysé et doit être conservée lors de l'interprétation des valeurs
          numériques.

      # -----------------------------------------------------------------------
      # Limites / références qualité
      # -----------------------------------------------------------------------

      - name: limite_qualite_parametre
        description: >
          Limite de qualité du paramètre sous sa représentation source
          lorsqu'elle est fournie. Elle est conservée séparément de la
          référence de qualité. Son interprétation et son parsing sont
          volontairement reportés à la couche ODS.

      - name: reference_qualite_parametre
        description: >
          Référence de qualité du paramètre lorsqu'elle est fournie par la
          source. Elle est conservée séparément de la limite de qualité car
          ces deux champs portent des notions distinctes. Son interprétation
          métier est reportée à la couche ODS.

      # -----------------------------------------------------------------------
      # Conformité du prélèvement
      # -----------------------------------------------------------------------

      - name: conclusion_conformite_prelevement
        description: >
          Conclusion textuelle de conformité portant sur le prélèvement
          dans son ensemble. Elle ne doit pas être interprétée comme une
          conclusion spécifique à l'un des paramètres analysés.

      - name: conformite_limites_bact_prelevement
        description: >
          Code de conformité du prélèvement vis-à-vis des limites
          bactériologiques.

      - name: conformite_limites_pc_prelevement
        description: >
          Code de conformité du prélèvement vis-à-vis des limites
          physico-chimiques.

      - name: conformite_references_bact_prelevement
        description: >
          Code de conformité du prélèvement vis-à-vis des références
          bactériologiques.

      - name: conformite_references_pc_prelevement
        description: >
          Code de conformité du prélèvement vis-à-vis des références
          physico-chimiques.

      # -----------------------------------------------------------------------
      # Acteurs / installation
      # -----------------------------------------------------------------------

      - name: nom_uge
        description: >
          Nom de l'unité de gestion de l'eau associée au prélèvement.
          Cette notion reste distincte du distributeur et de la maîtrise
          d'ouvrage.

      - name: nom_distributeur
        description: "Nom du distributeur associé au prélèvement."

      - name: nom_moa
        description: "Nom du maître d'ouvrage associé au prélèvement."

      - name: code_installation_amont
        description: >
          Code de l'installation située en amont. Ce code est privilégié
          comme identifiant métier potentiel par rapport au libellé, qui
          peut évoluer dans le temps.
        data_tests:
          - not_null

      - name: nom_installation_amont
        description: >
          Nom de l'installation amont. Plusieurs libellés peuvent être
          observés dans le temps pour un même code d'installation.

      # -----------------------------------------------------------------------
      # Réseaux
      # -----------------------------------------------------------------------

      - name: reseaux
        description: >
          Tableau de structures contenant les réseaux associés au contexte
          du prélèvement, avec notamment leur code, leur nom et leur débit
          lorsqu'il est fourni. Le champ reste sous forme ARRAY<STRUCT> en
          staging afin de préserver le grain des résultats. Sur le périmètre
          étudié, l'ensemble des codes réseau est invariant entre les différents
          résultats d'un même prélèvement ; son éclatement et sa modélisation
          sont reportés à la couche ODS.